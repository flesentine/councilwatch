name: Update PR10 from main

on:
  push:
    branches:
      - test/review-app-core-coverage

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/review-app-core-coverage
          fetch-depth: 0

      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/update-pr10-main.yml
          git commit -m "Remove temporary PR update workflow"
          git push origin HEAD:test/review-app-core-coverage
