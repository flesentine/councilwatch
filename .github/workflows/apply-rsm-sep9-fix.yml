    assert not mi._role_labeled_person_correction_plausible(
        "Councilmember Ordona",
        "Kevin O'Connor",
        ["Councilmember Ordona"],
    )

    # The special path never applies without a transcript role label.
    assert not mi._role_labeled_person_correction_plausible(
        "Barrett",
        "Keri Lynn Baert",
        [],
    )


def test_conduit_financing_coverage_language_is_not_city_debt():
    plan = mi.CoveragePlan(
        items=[
            mi.CoverageItem(
                rank=1,
                topic=(
                    "Tax-Exempt Loan for St. Junipero Serra "
                    "Catholic School"
                ),
                score=9,
