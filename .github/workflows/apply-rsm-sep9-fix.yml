        plan,
        RSM_AGENDA,
    )

    why = plan.items[0].why_it_matters
    assert "public debt" not in why.casefold()
    assert "city debt" not in why.casefold()
    assert "third-party tax-exempt financing" in why.casefold()


def test_conduit_guard_does_not_override_explicit_city_obligation():
    plan = mi.CoveragePlan(
        items=[
