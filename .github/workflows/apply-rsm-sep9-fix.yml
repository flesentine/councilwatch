          action_guard_helper = '''

def unresolved_high_priority_formal_action_issues(
    story,
    intelligence,
):
    """
    Fail closed when a high-priority formal-action agenda item has
    no verified final disposition.

    An agenda recommendation to approve/adopt/authorize is not
    evidence that the council actually did so. But when that item
    is the lead or another high-priority MUST INCLUDE topic, a
    final audit may not pass while the validated action ledger is
    still only Discussed, Considered, Unclear, or otherwise
    unresolved.
    """
    coverage_items = [
        item
        for item in intelligence.get(
            "coverage_items",
            [],
        )
        if (
            item.get("must_include")
            and (
                int(item.get("rank") or 999) == 1
                or int(item.get("score") or 0) >= 8
            )
        )
    ]

    if not coverage_items:
        return []

    formal_intent = re.compile(
        r"\b(?:"
        r"approval|approve|approved|"
        r"adopt|adoption|adopted|"
        r"authorize|authorization|authorized|"
        r"award|awarded|"
        r"appoint|appointment|appointed|"
        r"deny|denial|denied|"
        r"reject|rejection|rejected"
        r")\b",
        re.I,
    )

    unresolved_statuses = {
        "unclear",
        "unknown",
        "discussed",
        "considered",
        "reviewed",
        "no council action",
        "no action",
    }

    stopwords = {
        "agenda",
        "approval",
        "approve",
        "approved",
        "city",
        "council",
        "item",
        "public",
        "resolution",
        "the",
        "with",
        "from",
        "for",
    }

    def tokens(value):
        return {
            token
            for token in re.findall(
                r"[a-z0-9]+",
                str(value or "").casefold(),
            )
            if len(token) >= 4
            and token not in stopwords
        }

    ledger = intelligence.get(
        "action_ledger",
        [],
    )

    issues = []

    for coverage in coverage_items:
        coverage_topic = str(
            coverage.get(
                "topic",
                "",
            )
        ).strip()

        coverage_tokens = tokens(
            coverage_topic
        )

        if len(coverage_tokens) < 2:
            continue

        candidates = []

        for action in ledger:
            action_status = str(
                action.get(
                    "action_status",
                    "",
                )
            ).strip().lower()

            if action_status in ACTION_FORMAL_STATUSES:
                continue

            if action_status not in unresolved_statuses:
                continue

            section = str(
                action.get(
                    "agenda_section",
                    "",
                )
            ).strip().upper()

            if section == "CONSENT CALENDAR":
                continue

            agenda_title = str(
                action.get(
                    "agenda_title",
                    "",
                )
            ).strip()

            if not formal_intent.search(
                agenda_title
            ):
                continue

            action_tokens = tokens(
                str(
                    action.get(
                        "topic",
                        "",
                    )
                )
                + " "
                + agenda_title
            )

            overlap = len(
                coverage_tokens
                & action_tokens
            )

            if overlap < 2:
                continue

            candidates.append(
                (
                    overlap,
                    action,
                )
            )

        if not candidates:
            continue

        candidates.sort(
            key=lambda entry: entry[0],
            reverse=True,
        )

        action = candidates[0][1]

        item_number = str(
            action.get(
                "item_number",
                "",
            )
        ).strip()

        agenda_title = str(
            action.get(
                "agenda_title",
                "",
            )
        ).strip()

        action_status = str(
            action.get(
                "action_status",
                "unclear",
            )
        ).strip().lower()

        field = "headline"
        draft_text = str(
            story.headline or ""
        ).strip()

        if not draft_text:
            field = "dek"
            draft_text = str(
                story.dek or ""
            ).strip()

        if not draft_text and story.body:
            field = "body"
            draft_text = str(
                story.body[0] or ""
            ).strip()

        if not draft_text:
            continue

        item_label = (
            f"Agenda item {item_number}"
            if item_number
            else "The official agenda item"
        )

        issues.append(
            AuditIssue(
                severity="material",
                field=field,
                draft_text=draft_text,
                source_evidence=(
                    f"{item_label} calls for formal action "
                    f"({agenda_title}), but CouncilWatch's "
                    "source-validated action ledger only "
                    f"establishes '{action_status}'. The final "
                    "council disposition is unresolved."
                ),
                correction=(
                    "Verify the same item's motion/vote from the "
                    "recording or another official result source. "
                    "Do not infer approval or adoption from the "
                    "agenda recommendation alone."
                ),
            )
        )

    return issues
'''

