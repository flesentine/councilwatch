name: Apply RSM September 9 guard fixes

on:
  push:
    branches:
      - fix/rsm-outcome-entity-financing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rsm-outcome-entity-financing

      - name: Apply patch helper
        run: python .github/apply_rsm_sep9_fix.py

      - name: Compile patched files
        run: |
          python -m py_compile meeting_intelligence.py process_city.py tests/test_rsm_sept9_regressions.py
          git diff --check

      - name: Commit patched branch
        run: |
          rm .github/apply_rsm_sep9_fix.py
          rm .github/workflows/apply-rsm-sep9-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meeting_intelligence.py process_city.py tests/test_rsm_sept9_regressions.py .github/apply_rsm_sep9_fix.py .github/workflows/apply-rsm-sep9-fix.yml
          git diff --cached --check
          git commit -m "Harden RSM outcome and entity verification"
          git push origin HEAD:fix/rsm-outcome-entity-financing
