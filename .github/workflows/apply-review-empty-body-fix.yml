name: Apply review empty-body fix

on:
  push:
    branches:
      - fix/review-app-empty-body-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/review-app-empty-body-validation
          fetch-depth: 0

      - name: Apply focused product fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("review_app.py")
          text = path.read_text(encoding="utf-8")

          old_validation = '''    if (\n        not isinstance(body, list)\n        or not body\n    ):\n        return JSONResponse(\n            {\n                "ok": False,\n                "error": "Article body cannot be blank.",\n            },\n            status_code=400,\n        )\n\n    backup_revision(\n'''

          new_validation = '''    if not isinstance(\n        body,\n        list,\n    ):\n        return JSONResponse(\n            {\n                "ok": False,\n                "error": "Article body cannot be blank.",\n            },\n            status_code=400,\n        )\n\n    normalized_body = [\n        str(x).strip()\n        for x in body\n        if str(x).strip()\n    ]\n\n    if not normalized_body:\n        return JSONResponse(\n            {\n                "ok": False,\n                "error": "Article body cannot be blank.",\n            },\n            status_code=400,\n        )\n\n    backup_revision(\n'''

          old_assignment = '''    target["body"] = [\n        str(x).strip()\n        for x in body\n        if str(x).strip()\n    ]\n'''

          new_assignment = '''    target["body"] = (\n        normalized_body\n    )\n'''

          if text.count(old_validation) != 1:
              raise SystemExit("original body-validation block not found exactly once")
          if text.count(old_assignment) != 1:
              raise SystemExit("original body assignment not found exactly once")

          text = text.replace(old_validation, new_validation, 1)
          text = text.replace(old_assignment, new_assignment, 1)
          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/test_review_app_save_validation.py <<'PY'
          import asyncio
          import json

          import review_app as review


          class FakeRequest:
              async def json(self):
                  return {
                      "headline": "Still a real headline",
                      "dek": "Still a real dek",
                      "body": ["   ", "\n\t"],
                      "key_facts": [],
                      "verification_notes": [],
                  }


          def test_whitespace_only_body_is_rejected_before_mutation(
              tmp_path,
              monkeypatch,
          ):
              drafts = tmp_path / "drafts"
              drafts.mkdir()
              revisions = drafts / "_revisions"
              revisions.mkdir()

              monkeypatch.setattr(review, "DRAFTS", drafts)
              monkeypatch.setattr(review, "REVISION_DIR", revisions)

              original = {
                  "city_slug": "alpha",
                  "city_name": "Alpha City",
                  "external_id": "100",
                  "meeting_date": "2026-09-01",
                  "meeting_title": "Regular City Council Meeting",
                  "headline": "Original headline",
                  "dek": "Original dek",
                  "body": ["Original article paragraph."],
                  "key_facts": [],
                  "verification_notes": [],
                  "audit_ok": True,
                  "audit_issues": [],
                  "review_status": "approved",
                  "review_note": "",
                  "revision": 7,
                  "published": False,
                  "published_at": None,
              }

              path = drafts / "alpha--100.json"
              review.write_json(path, original)
              before = path.read_text(encoding="utf-8")

              response = asyncio.run(
                  review.save_story(
                      "alpha",
                      "100",
                      FakeRequest(),
                  )
              )

              assert response.status_code == 400
              payload = json.loads(response.body.decode("utf-8"))
              assert payload == {
                  "ok": False,
                  "error": "Article body cannot be blank.",
              }
              assert path.read_text(encoding="utf-8") == before
              assert list(revisions.glob("*.json")) == []
          PY

          python -m py_compile review_app.py tests/test_review_app_save_validation.py

          git rm .github/workflows/apply-review-empty-body-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review_app.py tests/test_review_app_save_validation.py
          git diff --cached --check
          git commit -m "Reject blank normalized review bodies"
          git push origin HEAD:fix/review-app-empty-body-validation
