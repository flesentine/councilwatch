name: Apply review signal patch

on:
  push:
    branches:
      - fix/review-entity-signal

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply review entity signal filter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-entity-signal
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python tools/apply_review_signal_patch.py

      - name: Run focused review tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_review_app_core.py tests/test_review_app_entity_signal.py

      - name: Commit guarded patch
        shell: bash
        run: |
          if git diff --quiet -- review_app.py; then
            echo 'No review_app.py change produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review_app.py
          git commit -m 'Apply review entity signal filter'
          git push origin HEAD:fix/review-entity-signal
