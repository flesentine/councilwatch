name: Apply RSM guard review tightening

on:
  push:
    branches:
      - fix/rsm-outcome-entity-financing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rsm-outcome-entity-financing

      - name: Apply review tightening
        run: python .github/apply_rsm_review_tightening.py

      - name: Compile patched files
        run: |
          python -m py_compile process_city.py tests/test_rsm_sept9_regressions.py
          git diff --check

      - name: Commit tightened branch
        run: |
          rm .github/apply_rsm_review_tightening.py
          rm .github/workflows/apply-rsm-review-tightening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add process_city.py tests/test_rsm_sept9_regressions.py .github/apply_rsm_review_tightening.py .github/workflows/apply-rsm-review-tightening.yml
          git diff --cached --check
          git commit -m "Tighten RSM final audit guards"
          git push origin HEAD:fix/rsm-outcome-entity-financing
