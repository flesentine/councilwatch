name: Apply PR 17 review fixes

on:
  push:
    branches:
      - fix/rsm-outcome-entity-financing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rsm-outcome-entity-financing

      - name: Apply review fixes
        run: python .github/apply_rsm_review_findings.py

      - name: Compile patched files
        run: |
          python -m py_compile meeting_intelligence.py process_city.py tests/test_rsm_sept9_regressions.py
          git diff --check

      - name: Commit reviewed branch
        run: |
          rm .github/apply_rsm_review_findings.py
          rm .github/workflows/apply-rsm-review-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meeting_intelligence.py process_city.py tests/test_rsm_sept9_regressions.py .github/apply_rsm_review_findings.py .github/workflows/apply-rsm-review-findings.yml
          git diff --cached --check
          git commit -m "Address RSM guard review findings"
          git push origin HEAD:fix/rsm-outcome-entity-financing
