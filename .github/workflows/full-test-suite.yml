name: Full Test Suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-test-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 full suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      COVERAGE_FLOOR: "17.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" "pytest-cov>=6,<8"
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q *.py discovery tests

      - name: Run complete pytest suite with coverage
        run: |
          python -m pytest -q \
            --cov=. \
            --cov-config=.coveragerc \
            --cov-fail-under="$COVERAGE_FLOOR" \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml

      - name: Publish coverage summary
        if: always() && hashFiles('coverage.json') != ''
        run: |
          python - <<'PY'
          import json
          import os

          with open("coverage.json", encoding="utf-8") as fh:
              totals = json.load(fh)["totals"]

          statements = totals.get("num_statements", 0)
          covered = totals.get("covered_lines", 0)
          missing = totals.get("missing_lines", 0)
          branches = totals.get("num_branches", 0)
          covered_branches = totals.get("covered_branches", 0)
          percent = float(totals.get("percent_covered", 0.0))
          floor = float(os.environ["COVERAGE_FLOOR"])

          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("## Coverage\n\n")
              fh.write(f"**Total coverage: {percent:.1f}%**\n\n")
              fh.write(f"Required floor: **{floor:.1f}%**\n\n")
              fh.write("| Metric | Value |\n")
              fh.write("| --- | ---: |\n")
              fh.write(f"| Statements | {statements} |\n")
              fh.write(f"| Covered lines | {covered} |\n")
              fh.write(f"| Missing lines | {missing} |\n")
              fh.write(f"| Branches | {branches} |\n")
              fh.write(f"| Covered branches | {covered_branches} |\n")
          PY

      - name: Upload coverage reports
        if: always() && hashFiles('coverage.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: 14
