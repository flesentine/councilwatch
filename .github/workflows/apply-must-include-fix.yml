name: Apply MUST INCLUDE enforcement patch

on:
  push:
    branches:
      - fix/must-include-final-enforcement
    paths:
      - .github/workflows/apply-must-include-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/must-include-final-enforcement
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_must_include_fix.py

      - name: Compile patched files
        run: |
          python -m py_compile process_city.py tests/test_must_include_enforcement.py
          git diff --check

      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce MUST INCLUDE coverage in final audit"
          git push origin HEAD:fix/must-include-final-enforcement
